# Actual site configuration applied manually on 2026-11-15.
server {
    listen 80;
    server_name habits.gilinsky.ru;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/habit_tracker-acme;
    }
    location / {
        return 301 https://habits.gilinsky.ru$request_uri;
    }
}
server {
    listen 443 ssl;
    server_name habits.gilinsky.ru;
    ssl_certificate /etc/letsencrypt/live/habits.gilinsky.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/habits.gilinsky.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 32k;
    access_log /var/log/nginx/habit_tracker.access.log combined;
    error_log /var/log/nginx/habit_tracker.error.log warn;
    location / {
        proxy_pass http://127.0.0.1:8017;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-SSL "";
        proxy_set_header X-Forwarded-Protocol "";
        proxy_set_header Forwarded "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
        proxy_send_timeout 35s;
    }
}
